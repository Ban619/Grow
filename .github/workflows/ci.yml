name: CI

on:
  push:
  pull_request:

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  agent-sandbox:
    name: Agent sandbox smoke test
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sandbox image
        run: |
          docker build -t copilot-sandbox:latest .copilot/sandbox

      - name: Run agent in sandbox (timeout 300s)
        run: |
          timeout 300 docker run --rm --network none --memory 512m --cpus 0.5 -v ${{ github.workspace }}:/workspace:ro copilot-sandbox:latest
