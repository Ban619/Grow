name: Secret Scanning & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run detect-secrets
        uses: Yelp/detect-secrets-action@v1
        with:
          baseline: .secrets.baseline
          plugins: |
            - type: AWS Access Key
            - type: Private Key
            - type: Slack Token
            - type: Stripe Access Key
            - type: GitHub Token
            - type: Base64 High Entropy String

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: results.sarif

  security-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify no hardcoded credentials
        run: |
          set -e
          echo "Scanning for hardcoded secrets..."
          
          # Patterns to block
          patterns=(
            "PRIVATE_KEY="
            "PASSWORD="
            "API_KEY="
            "SECRET="
            "TOKEN="
          )
          
          for pattern in "${patterns[@]}"; do
            if grep -r --include="*.py" --include="*.js" --include="*.ts" \
              --include="*.go" --include="*.java" --include="*.yaml" \
              "$pattern" . --exclude-dir=.git --exclude-dir=node_modules; then
              echo "ERROR: Found potential credential pattern: $pattern"
              exit 1
            fi
          done
          
          echo "✓ No obvious credential patterns found"

  audit-log:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check audit log rotation
        run: |
          if [ -f ".logs/copilot-audit.log" ]; then
            echo "Audit log present; checking size..."
            size=$(wc -c < ".logs/copilot-audit.log")
            if [ $size -gt 104857600 ]; then  # 100MB
              echo "WARNING: Audit log exceeds 100MB; rotation recommended"
            fi
          fi
